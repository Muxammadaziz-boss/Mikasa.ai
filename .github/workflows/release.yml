name: Mikasa AI Windows Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign & Release Windows Desktop
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography aiohttp packaging psutil requests

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mikasa-7/package.json'

      - name: Install Frontend Dependencies
        working-directory: mikasa-7
        run: npm install

      - name: Run Backend Tests
        run: |
          python -m unittest tests/test_v8_secure_updater.py
          python -m unittest tests/test_v8_backend_bundle.py

      - name: Run Frontend Tests
        working-directory: mikasa-7
        run: npm test

      - name: Build Frontend Application
        working-directory: mikasa-7
        run: npm run build

      - name: Check / Build Tauri Desktop Application
        run: |
          $tag = "${{ github.ref_name }}"
          $exePath = "release/$tag/Mikasa-AI-$tag.exe"
          if (Test-Path $exePath) {
              Write-Host "Pre-compiled desktop binaries found at $exePath. Skipping recompilation."
          } else {
              Write-Host "No pre-compiled binaries found for $tag. Building Tauri desktop application..."
              cd mikasa-7
              npm run build:desktop
              node scripts/package_release.cjs
              cd ..
          }

      - name: Cryptographically Sign Release Manifest (Ed25519)
        env:
          MIKASA_RELEASE_SIGNING_KEY: ${{ secrets.MIKASA_RELEASE_SIGNING_KEY }}
        run: |
          $tag = "${{ github.ref_name }}"
          $manifest = "release/$tag/version_manifest.json"
          if (-not (Test-Path $manifest)) {
              $manifest = "release/v8.0.0/version_manifest.json"
          }
          if ($env:MIKASA_RELEASE_SIGNING_KEY) {
              Write-Host "MIKASA_RELEASE_SIGNING_KEY secret found. Signing release manifest..."
              python packaging/sign_release.py --manifest $manifest
          } else {
              Write-Host "MIKASA_RELEASE_SIGNING_KEY not set in GitHub secrets. Verifying pre-signed manifest..."
              python -c "import json; from core.v8.update_service import UpdateCrypto; c = UpdateCrypto(); m = json.load(open('$manifest')); [c.verify_artifact('release/$tag/' + f['name'], f['sha256'], f['signature']) for f in m.get('files', [])]; print('Verified pre-signed release manifest successfully.')"
          }

      - name: Clean Existing Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Checking if release $tag already exists on GitHub..."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag exists. Cleaning up older assets to guarantee clean update..."
              $assets = gh release view $tag --json assets -q ".assets[].name"
              foreach ($asset in $assets) {
                  if ($asset) {
                      Write-Host "Deleting existing asset: $asset"
                      gh release delete-asset $tag $asset --yes 2>$null
                  }
              }
          }

      - name: Create GitHub Release & Upload Signed Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Mikasa AI ${{ github.ref_name }} (Windows Production Release)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 Mikasa AI v8.0.0 — Level 8 Autonomous Desktop Assistant & Intelligence Hub

            Rasmiy Mikasa AI v8.0.0 Windows Production Release.

            ### 📦 Reliz Fayllari (Ed25519 & SHA-256 bilan imzolangan):
            - **`Mikasa-AI-v8.0.0-Portable.zip`**: To'liq mustaqil (Self-contained) portativ arxiv — 59 MB (ichida standalone backend runtime, WebView2Loader va `run_portable.bat` bilan, foydalanuvchidan Python yoki Node talab qilinmaydi).
            - **`Mikasa-AI-Setup-v8.0.0.exe`**: Windows NSIS Setup o'rnatuvchisi (Tavsiya etiladi — 2.01 MB).
            - **`Mikasa-AI-v8.0.0.exe`**: O'zida WebView2Loader kutubxonasini avtomatik ta'minlovchi mustaqil ilova (4.87 MB).
            - **`Mikasa-AI-v8.0.0.msi`**: Standart Windows Installer paketi (2.70 MB).
            - **`WebView2Loader.dll`**: Native Windows runtime dll (156 KB).
            - **`run_portable.bat`**: Backend va Frontendni bir bosishda ishga tushiruvchi bat skript.
            - **`version_manifest.json`**: Kriptografik imzolangan reliz manifesti.

            ### ⚡ Asosiy Imkoniyatlar (v8.0.0):
            1. **Self-Contained Backend Runtime**: Python 3.11 yoki Node.js o'rnatilmagan kompyuterlarda ham `127.0.0.1:18420` backend to'liq mustaqil ishlaydi.
            2. **Native Tauri Backend Supervisor**: Dastur ochilganda backend holati tekshiriladi, fon rejimida boshqariladi va ilova yopilganda toza to'xtatiladi.
            3. **Google OAuth & Desktop Pairing**: Brauzer orqali Google OAuth autentifikatsiyasi va avtomatik callback sessiyalari 100% integratsiya qilindi.
            4. **Kriptografik xavfsizlik**: Barcha reliz artefaktlari Ed25519 algoritmi bilan imzolangan va xavfsiz avtomatik yangilanish tizimi bilan himoyalangan.

            ### 🔐 Xavfsizlik:
            - **Trusted Ed25519 Public Key**: `b4be839fd62657c0e786e1a2ad590c05c45c511371d041137c5ca9ac57c29829`
            - **Avtomatik yangilanish**: Fail-closed, atomik staging va xavfsiz rollback.
          files: |
            release/${{ github.ref_name }}/*.exe
            release/${{ github.ref_name }}/*.msi
            release/${{ github.ref_name }}/*.zip
            release/${{ github.ref_name }}/version_manifest.json
            release/${{ github.ref_name }}/WebView2Loader.dll
            release/${{ github.ref_name }}/run_portable.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

