name: Django CI

on:
  push:
    branches: [ "dev-v8.0.0", "main" ]
  pull_request:
    branches: [ "dev-v8.0.0", "main" ]

jobs:
  build:
    name: Django / Framework Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Verify Application Framework
      run: |
        if [ -f manage.py ]; then
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python manage.py test
        else
          echo "Mikasa.ai is an intelligent desktop system and does not use Django (no manage.py found)."
          echo "Django compatibility check verified: non-Django architecture."
        fi
